[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bgc2activity-reconstructed"
version = "0.1.0"
description = "Method-consistent reconstruction of the BGC2Activity workflow"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
models = [
  "torch>=2.0",
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.3",
]
annotation = [
  "pyrodigal==3.7.1",
  "pyhmmer==0.12.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
