schema_version: "1.0"
source: "Supplementary Methods 9-10"
status: "manuscript-derived interface; frozen corpus and checkpoint pending"
corpus:
  parsed_canonical_sequences: 118630
  core_length_range: [4, 64]
  chemical_entity_candidates: 64127
  nonstandard_or_modified_entity_candidates: 17618
  split: {train: 0.80, validation: 0.10, test: 0.10, seed: 20260802}
  structural_cluster_rule: "identical entities; terminal/configurational variants; or global alignment similarity >=0.80 and length ratio >=0.80"
encoding:
  vocabulary_tokens: 47
  standard_monomers: 20
  nonstandard_monomers: 24
  configuration_encoding: "parallel three-level D/L field"
  chemical_text: {method: BLAKE2b_hashing, dimension: 24, l2_normalized: true}
  numeric_descriptors: [hydrophobicity, charge, polarity, aromaticity, mass, configuration, lipid_chain_carbon_count, cyclic_indicator]
  numeric_descriptor_dimension: 8
  projection_dimension_per_modality: 96
  missing_values: "training-set median plus missingness indicator"
architecture:
  maximum_length: 64
  transformer_layers: 3
  hidden_dimension: 96
  attention_heads: 4
  ffn_dimension: 384
  activation: GELU
  normalization: pre_layer_norm
  dropout: 0.10
objective:
  target_dimension: 32
  masking_probability: 0.30
  mask_random_unchanged_ratio: [0.80, 0.10, 0.10]
  minimum_masked_positions_per_sequence: 1
  loss: "smooth_L1 + 0.20 * cosine_distance"
training:
  optimizer: AdamW
  epochs: 30
  batch_size: 128
  learning_rate: 0.0008
  weight_decay: 0.001
  gradient_clipping: 1.0
  seed: 20260802
  checkpoint_selection: "lowest validation total loss"
