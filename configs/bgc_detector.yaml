schema_version: "1.0"
source: "Supplementary Methods 3-7"
status: "manuscript-derived interface; not a checkpoint specification"
input:
  representation: "frozen pfam2vec"
  dimension: 102
  maximum_pfam_positions: 256
  oov_representation: "OOV token"
  padding_masked_in: [detection_loss, pooling, metrics]
encoder:
  projection_dimension: 128
  layers: 4
  layer_order: [time_mixing, channel_mixing]
  time_mixing: "causal linear attention along sequence positions"
  channel_mixing:
    ffn_expansion_ratio: 4
    activation: GELU
  normalization: pre_layer_norm
  residual_connections: true
  dropout: 0.15
moe:
  experts: 8
  expert_ffn_hidden_dimension: 256
  activation: GELU
  router: "linear projection, softmax, top-2 sparse activation"
  load_balancing_loss_coefficient: 0.01
heads:
  detection:
    output: "per-position sigmoid probability"
    calling_threshold: 0.45
  class:
    categories: [NRPS, PKS, RiPP, terpene, other]
    architecture: "masked mean pooling; 128 -> 64 -> 5 MLP"
    role: "auxiliary supervision; does not rewrite final region boundaries"
  evolutionary_contrastive:
    representation: "masked mean pooled MoE output"
partition:
  seed: 42
  family_distance_threshold: 0.35
  random: {train: 2778, held_out: 1190, family_cross_partition_percent: 12.0}
  evolutionary_family_held_out: {train: 2162, held_out: 1806, family_cross_partition_percent: 0.0}
