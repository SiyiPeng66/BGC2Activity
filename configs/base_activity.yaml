schema_version: "2.0"
source: "main text section 2.3 (Base MIC Regression Model); freeze boundary and feature fusion from Supplementary Methods 11-12; regression formulation adopted by author decision DC-1 (2026-08-20)"
status: "manuscript-derived interface; training set/checkpoints pending"
supervision:
  target: "continuous log10(MIC); prespecified MIC thresholds define experimental endpoints only and never enter training"
  curation: "quantitative public MIC measurements (146,547 harmonised records); unit buckets uM and ug_mL kept separate, no conversion; entity-level target = minimum log10(MIC) within the preferred ug_mL bucket (RD-8)"
  descriptive_strict_funnel: "146,547 -> 61,545 strict-labelled records -> 7,358 unique sequences -> 4,739 nonstandard/modification subset (Supplementary Table S2c; descriptive only)"
  effective_training_subset: 4739
  cluster_split: {train: 0.70, validation: 0.15, test: 0.15, seed: 42}
  cluster_rule: "chemical entity and structural similarity: sequence similarity >=0.80 with length ratio >=0.80, or Morgan Tanimoto >=0.60"
encoder_finetuning:
  frozen: [monomer_projections, positional_encodings, transformer_layer_1, transformer_layer_2]
  trainable: [transformer_layer_3, output_layer_norm, candidate_pooling_module]
  excluded: [pretraining_chemical_recovery_head]
candidate_representation:
  pooling: "attention-weighted mean + weighted standard deviation + per-dimension maximum"
  output_dimension: 96
  continuous_features: [length, molecular_weight, net_charge_pH7, GRAVY, aromatic_fraction, nonstandard_monomer_fraction, lipidation_descriptors]
  categorical_states: [N_terminal, C_terminal, lipidation, cyclization]
  numeric_chemistry_dimension: 32
  imputation: "training-set median plus missingness indicators"
  standardization: "training-set mean and standard deviation"
head:
  type: "scalar regression head"
  layers: [128, 64, 1]
  activation: GELU
  layer_norm: true
  dropout: [0.30, 0.20]
  output: "Sbase = predicted log10(MIC); lower denotes greater predicted activity"
training:
  loss: "Huber (smooth L1, delta 1.0 log10 unit; RD-7)"
  optimizer: AdamW
  learning_rates: {fine_tuned_layers: 0.00001, newly_initialized_layers: 0.0003}
  weight_decay: 0.0001
  batch_size: 64
  max_epochs: 100
  gradient_clipping: 1.0
  early_stopping_patience: 12
  selection: "validation RMSE; ties within 1e-4 use higher validation Spearman (RD-13)"
  evaluation: [MAE, RMSE, Spearman, observed_versus_predicted_agreement, residual_structure]
production:
  fixed_seeds: 5
  sbase: "arithmetic mean of seed-level predicted log10(MIC)"
  uncertainty: "inter-model dispersion"
